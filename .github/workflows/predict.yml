name: Deadline-relative Predictions

on:
  schedule:
    # Postgres deadlines decide when work is due. Frequent polling avoids
    # encoding a changing FPL deadline in a static GitHub Actions cron.
    # This cadence assumes a public repository; see spec 0001. Re-enable the
    # schedule before each Season if off-season inactivity disabled it.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      gameweek:
        description: Gameweek whose remaining Gaps should be filled
        required: true
        type: number

permissions:
  contents: read
  issues: write

concurrency:
  group: prediction-runs
  cancel-in-progress: false

jobs:
  scheduled:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SEASON: ${{ vars.SEASON }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      PREDICT_CONCURRENCY: ${{ vars.PREDICT_CONCURRENCY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Migrations are deployed deliberately before enabling this workflow.
      - name: Run due Prediction collections
        env:
          FILL_GAP_REPORT_PATH: ${{ runner.temp }}/prediction-fill-gaps.md
        run: npm run predict:scheduled
      - name: Open or update the Fill Gap issue
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PREDICT_ALERT_ASSIGNEE: ${{ vars.PREDICT_ALERT_ASSIGNEE }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FILL_GAP_REPORT_PATH: ${{ runner.temp }}/prediction-fill-gaps.md
        run: bash scripts/report-prediction-fill-gaps.sh

  manual:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SEASON: ${{ vars.SEASON }}
      GAMEWEEK: ${{ inputs.gameweek }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      PREDICT_CONCURRENCY: ${{ vars.PREDICT_CONCURRENCY }}
      PREDICTION_TRIGGER: manual
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Migrations are deployed deliberately before enabling this workflow.
      - run: npm run predict

  report-failure:
    needs: [scheduled, manual]
    if: ${{ always() && (needs.scheduled.result == 'failure' || needs.manual.result == 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Open or update the Prediction workflow failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          PREDICT_ALERT_ASSIGNEE: ${{ vars.PREDICT_ALERT_ASSIGNEE }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/report-predict-failure.sh

name: Deadline-relative FPL Gameweek actions

on:
  # Chained to the Prediction workflow rather than given a cron of its own.
  # Postgres deadlines still decide when work is due — the FPL scheduler polls
  # exactly as the Match one does — but the two tracks share a deadline
  # (ADR-0006) and the Match track's write path must not wait behind an FPL
  # Gameweek. A second poll cron ran the two in whichever order GitHub
  # happened to start them; `workflow_run` puts Predictions first every time.
  #
  # `types: [completed]` fires whatever the Match run concluded. A failing
  # Prediction run is not a reason to stop managing nine Squads, and the FPL
  # Gameweek has its own Lock to reach.
  workflow_run:
    workflows: ["Deadline-relative Predictions"]
    types: [completed]
  workflow_dispatch:
    inputs:
      gameweek:
        description: Gameweek to start the FPL track at, for all nine Entrants
        required: true
        type: number

permissions:
  contents: read

# Its own group, deliberately not `prediction-runs`. The ordering above decides
# which starts first; this decides that neither ever queues behind the other —
# an FPL Gameweek that overran would otherwise hold up the next Prediction poll
# half an hour later.
concurrency:
  group: fpl-runs
  cancel-in-progress: false

jobs:
  scheduled:
    if: ${{ github.event_name == 'workflow_run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SEASON: ${{ vars.SEASON }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      FPL_CONCURRENCY: ${{ vars.FPL_CONCURRENCY }}
      # Unset is the fetcher's two minutes, which three of nine seats died
      # at on every run of the dry opening (spec 0010).
      ENTRANT_CALL_TIMEOUT_MS: ${{ vars.ENTRANT_CALL_TIMEOUT_MS }}
      # Unset is six hours, the lead the Match track's main run takes against
      # the same deadline. Raising it here starts every Gameweek earlier.
      FPL_RUN_LEAD_HOURS: ${{ vars.FPL_RUN_LEAD_HOURS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Migrations are deployed deliberately before enabling this workflow.
      - name: Run due FPL Gameweek actions
        run: npm run fpl:scheduled

  start:
    # The one thing an operator does by hand. It commits all nine opening
    # Manager States or none, and it refuses a Season already under way, so
    # running it twice cannot discard a track that has begun.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SEASON: ${{ vars.SEASON }}
      GAMEWEEK: ${{ inputs.gameweek }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      FPL_CONCURRENCY: ${{ vars.FPL_CONCURRENCY }}
      # Unset is the fetcher's two minutes, which three of nine seats died
      # at on every run of the dry opening (spec 0010).
      ENTRANT_CALL_TIMEOUT_MS: ${{ vars.ENTRANT_CALL_TIMEOUT_MS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fpl:start
